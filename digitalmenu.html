<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>McDonald's Menu</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    /* ========== EXACT COPY OF FILE 2 DESIGN ========== */
    /* 100% IDENTICAL - SAME COLORS, SAME WHITE BACKGROUND, SAME EVERYTHING */
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: #ffffff;
      color: #000000;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 20px;
      width: 100%;
    }

    /* ===== MCDONALD'S BRAND HEADER - EXACT FROM FILE 2 ===== */
    .header {
      background: linear-gradient(135deg, #ffd700 0%, #ffb700 100%);
      padding: 16px 24px;
      border-radius: 28px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 15px 35px rgba(255, 215, 0, 0.25);
      position: relative;
      overflow: hidden;
    }

    .header::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -20%;
      width: 140%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 70%);
      transform: rotate(15deg);
    }

    .header-content {
      position: relative;
      z-index: 2;
    }

    .header h1 {
      font-size: 26px;
      font-weight: 900;
      margin-bottom: 4px;
      color: #0a0f1e;
      letter-spacing: -0.5px;
      text-shadow: 2px 2px 0 rgba(255,255,255,0.3);
    }

    .header p {
      font-size: 14px;
      color: #1a1f2e;
      font-weight: 700;
      opacity: 0.9;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .header p::after {
      content: '★';
      color: #da291c;
      font-size: 16px;
    }

    .logo {
      background: #da291c;
      padding: 12px 18px;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 0 #8a1e15;
      transform: translateY(-2px);
      position: relative;
      z-index: 2;
    }

    .logo-arches {
      font-size: 32px;
      font-weight: 900;
      color: #ffd700;
      text-shadow: 2px 2px 0 #00000020;
      line-height: 1;
    }

    /* ===== CATEGORIES - EXACT FROM FILE 2 ===== */
    .categories {
      display: flex;
      gap: 10px;
      padding: 8px;
      background: rgba(0, 0, 0, 0.03);
      border-radius: 40px;
      margin-bottom: 32px;
      flex-wrap: wrap;
      border: 1px solid rgba(0, 0, 0, 0.05);
    }

    .category-btn {
      padding: 12px 24px;
      border-radius: 40px;
      border: none;
      background: transparent;
      color: rgba(0, 0, 0, 0.6);
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .category-btn.active {
      background: #ffd700;
      color: #0a0f1e;
      box-shadow: 0 8px 20px rgba(255, 215, 0, 0.3);
    }

    .category-btn:hover {
      background: rgba(255, 215, 0, 0.2);
      color: #0a0f1e;
    }

    /* ===== MENU GRID - EXACT FROM FILE 2 ===== */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
      margin-bottom: 40px;
    }

    .menu-card {
      background: rgba(0, 0, 0, 0.02);
      border-radius: 28px;
      overflow: hidden;
      border: 1px solid rgba(0, 0, 0, 0.05);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 15px 35px -10px rgba(0,0,0,0.1);
    }

    .menu-card:hover {
      transform: translateY(-8px);
      border-color: #ffd700;
      box-shadow: 0 25px 45px -10px rgba(255, 215, 0, 0.25);
    }

    .menu-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      transition: transform 0.5s ease;
      border-bottom: 3px solid #ffd700;
    }

    .menu-card:hover img {
      transform: scale(1.08);
    }

    .card-content {
      padding: 20px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      background: white;
    }

    .item-name {
      font-size: 22px;
      font-weight: 800;
      color: #0a0f1e;
      margin-bottom: 8px;
      line-height: 1.2;
      letter-spacing: -0.5px;
    }

    .item-desc {
      color: rgba(0, 0, 0, 0.5);
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 16px;
      flex-grow: 1;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .item-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
    }

    .item-price {
      font-size: 26px;
      font-weight: 900;
      color: #0a0f1e;
      line-height: 1;
      letter-spacing: -1px;
    }

    .item-price::after {
      content: ' SAR';
      font-size: 14px;
      font-weight: 600;
      color: #da291c;
      margin-left: 4px;
    }

    .item-calories {
      color: rgba(0, 0, 0, 0.3);
      font-size: 11px;
      font-weight: 500;
      margin-top: 4px;
    }

    .add-btn {
      background: #ffd700;
      border: none;
      color: #0a0f1e;
      padding: 12px 24px;
      border-radius: 40px;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 8px 20px rgba(255, 215, 0, 0.25);
      white-space: nowrap;
      letter-spacing: -0.3px;
    }

    .add-btn:hover {
      background: #000000;
      color: #ffffff;
      transform: scale(1.05);
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.2);
    }

    .add-btn.added {
      background: #00e676;
      color: #0a0f1e;
    }

    /* ===== POPULAR BADGE - EXACT FROM FILE 2 ===== */
    .popular-badge {
      position: absolute;
      top: 16px;
      left: 16px;
      background: #da291c;
      color: white;
      padding: 8px 16px;
      border-radius: 40px;
      font-size: 12px;
      font-weight: 800;
      z-index: 10;
      box-shadow: 0 8px 0 #8a1e15;
      transform: translateY(-2px);
      letter-spacing: 0.5px;
    }

    /* ===== MODAL - EXACT FROM FILE 2 ===== */
    .modifier-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modifier-content {
      background: white;
      border-radius: 36px;
      padding: 28px;
      width: 100%;
      max-width: 480px;
      max-height: 85vh;
      overflow-y: auto;
      border: 1px solid rgba(0, 0, 0, 0.1);
      box-shadow: 0 30px 60px rgba(0,0,0,0.3);
    }

    .modifier-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 2px solid rgba(0, 0, 0, 0.05);
    }

    .modifier-header h3 {
      font-size: 24px;
      font-weight: 800;
      color: #0a0f1e;
      margin: 0;
    }

    /* ===== FLOATING CART BUTTON - EXACT FROM FILE 2 ===== */
    .floating-cart-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: linear-gradient(145deg, #ffd700, #ffb700);
      color: #0a0f1e;
      width: 64px;
      height: 64px;
      border-radius: 32px;
      border: none;
      font-size: 26px;
      cursor: pointer;
      box-shadow: 0 12px 0 #b8860b, 0 20px 40px rgba(255, 215, 0, 0.3);
      z-index: 99;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      transition: all 0.1s ease;
      transform: translateY(-4px);
    }

    .floating-cart-btn:hover {
      transform: translateY(-8px);
      box-shadow: 0 16px 0 #b8860b, 0 25px 50px rgba(255, 215, 0, 0.4);
    }

    .cart-count {
      position: absolute;
      top: -8px;
      right: -8px;
      background: #da291c;
      color: white;
      width: 26px;
      height: 26px;
      border-radius: 13px;
      font-size: 13px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 0 #8a1e15;
    }

    /* ===== CART CONTAINER - EXACT FROM FILE 2 ===== */
    .cart-container {
      position: fixed;
      bottom: 104px;
      right: 24px;
      z-index: 100;
      display: none;
      max-width: 420px;
      width: calc(100% - 48px);
    }

    .cart-box {
      background: white;
      border-radius: 32px;
      padding: 24px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      box-shadow: 0 25px 50px rgba(0,0,0,0.2);
      max-height: 70vh;
      overflow-y: auto;
    }

    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 2px solid rgba(0, 0, 0, 0.05);
    }

    .cart-header h3 {
      font-size: 22px;
      font-weight: 800;
      color: #0a0f1e;
      margin: 0;
    }

    .close-btn {
      background: rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(0, 0, 0, 0.1);
      color: #0a0f1e;
      width: 40px;
      height: 40px;
      border-radius: 20px;
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .close-btn:hover {
      background: #ffd700;
      color: #0a0f1e;
      border-color: #ffd700;
    }

    /* ===== QTY BUTTONS ===== */
    .qty-btn {
      background: rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(0, 0, 0, 0.1);
      color: #0a0f1e;
      width: 36px;
      height: 36px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .qty-btn:hover {
      background: #ffd700;
      color: #0a0f1e;
      border-color: #ffd700;
    }

    /* ===== CHECKOUT BUTTONS ===== */
    .checkout-btn {
      background: linear-gradient(145deg, #ffd700, #ffb700);
      color: #0a0f1e;
      border: none;
      padding: 16px;
      border-radius: 32px;
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 10px 0 #b8860b;
      transform: translateY(-4px);
      letter-spacing: -0.3px;
    }

    .checkout-btn:hover {
      transform: translateY(-6px);
      box-shadow: 0 14px 0 #b8860b;
    }

    .clear-btn {
      background: rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(0, 0, 0, 0.1);
      color: #ff3b30;
      padding: 16px;
      border-radius: 32px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .clear-btn:hover {
      background: rgba(255, 59, 48, 0.1);
      border-color: #ff3b30;
    }

    /* ===== FOOTER - MCDONALD'S BRANDING ===== */
    .footer {
      text-align: center;
      padding: 40px 20px 20px;
      color: rgba(0, 0, 0, 0.4);
      border-top: 1px solid rgba(0, 0, 0, 0.05);
      margin-top: 40px;
    }

    .footer-logo {
      font-size: 48px;
      font-weight: 900;
      color: #ffd700;
      margin-bottom: 12px;
      text-shadow: 4px 4px 0 #da291c;
    }

    .footer p:last-child {
      color: #da291c;
      font-weight: 700;
      margin-top: 16px;
      font-size: 18px;
      letter-spacing: 2px;
    }

    /* ===== MODIFIER OPTIONS ===== */
    .modifier-option {
      background: rgba(0, 0, 0, 0.02);
      border: 1px solid rgba(0, 0, 0, 0.05);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .modifier-option:hover {
      background: rgba(255, 215, 0, 0.1);
      border-color: #ffd700;
    }

    .modifier-option.selected {
      background: rgba(255, 215, 0, 0.15);
      border: 2px solid #ffd700;
    }

    .radio-custom {
      width: 22px;
      height: 22px;
      border: 2px solid rgba(0, 0, 0, 0.2);
      border-radius: 11px;
      transition: all 0.2s ease;
    }

    .modifier-option.selected .radio-custom {
      background: #ffd700;
      border-color: #ffd700;
      box-shadow: 0 0 0 4px rgba(255, 215, 0, 0.2);
    }

    .add-order-btn {
      background: linear-gradient(145deg, #ffd700, #ffb700);
      color: #0a0f1e;
      border: none;
      padding: 18px;
      border-radius: 36px;
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 10px 0 #b8860b;
      transform: translateY(-4px);
      width: 100%;
      margin-top: 16px;
    }

    .add-order-btn:hover {
      transform: translateY(-6px);
      box-shadow: 0 14px 0 #b8860b;
    }

    .add-order-btn:disabled {
      opacity: 0.5;
      transform: translateY(-2px);
      box-shadow: 0 6px 0 #b8860b;
      cursor: not-allowed;
    }

    .validation-error {
      color: #ff3b30;
      background: rgba(255, 59, 48, 0.1);
      border: 1px solid #ff3b30;
      padding: 12px;
      border-radius: 16px;
      margin-bottom: 16px;
      text-align: center;
      font-weight: 600;
    }

    .quantity-selector {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.02);
      padding: 16px;
      border-radius: 20px;
      margin: 20px 0;
      border: 1px solid rgba(0, 0, 0, 0.05);
    }

    .quantity-label {
      font-weight: 700;
      color: #0a0f1e;
      font-size: 16px;
    }

    .qty-display {
      font-size: 20px;
      font-weight: 800;
      color: #0a0f1e;
      min-width: 40px;
      text-align: center;
    }

    .modifier-total {
      font-size: 24px;
      font-weight: 900;
      color: #0a0f1e;
      text-align: center;
    }

    .hidden {
      display: none !important;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      .container { padding: 16px; }
      .menu-grid { grid-template-columns: 1fr; }
      .header { flex-direction: column; text-align: center; gap: 16px; }
      .cart-container { bottom: 100px; right: 16px; left: 16px; width: auto; }
      .floating-cart-btn { width: 56px; height: 56px; font-size: 22px; right: 16px; }
    }

    @media (max-width: 480px) {
      .header h1 { font-size: 22px; }
      .category-btn { padding: 10px 18px; font-size: 13px; }
      .item-name { font-size: 20px; }
      .item-price { font-size: 24px; }
    }

    /* RTL Support */
    [dir="rtl"] {
      direction: rtl;
    }
    
    [dir="rtl"] .popular-badge {
      left: auto;
      right: 16px;
    }
    
    [dir="rtl"] .floating-cart-btn {
      right: auto;
      left: 24px;
    }
    
    [dir="rtl"] .cart-container {
      right: auto;
      left: 24px;
    }
    
    [dir="rtl"] .cart-count {
      right: auto;
      left: -8px;
    }
  </style>
</head>

<!-- CART CONTAINER -->

<!-- MODIFIER MODAL -->
<div class="modifier-modal" id="modifierModal">
  <div class="modifier-content">
    <div class="modifier-header">
      <h3 id="modifierTitle">تخصيص الوجبة</h3>
      <button class="close-btn" onclick="closeModifierModal()">×</button>

      <div class="modifier-options" id="flavorOptions"></div>
    </div>
    
    <div class="validation-error" id="modifierError">

    <div class="quantity-selector">
      <div class="quantity-label">الكمية</div>
      <div class="quantity-controls" style="display: flex; align-items: center; gap: 16px;">
        <button class="qty-btn" onclick="adjustQuantity(-1)">-</button>
        <div class="qty-display" id="modifierQty">١</div>
        <button class="qty-btn" onclick="adjustQuantity(1)">+</button>
      </div>
    </div>
    
    <div class="modifier-actions">
      <div class="modifier-price">
        <div class="modifier-total" id="modifierTotalPrice">٠.٠٠ ريال</div>
      </div>
      <button class="add-order-btn" id="addOrderBtn" onclick="addToCartWithModifier()" disabled>
        <span style="margin-left: 8px;">➕</span>
        أضف إلى الطلب
      </button>
    </div>
  </div>
</div>

<!-- FOOTER - MCDONALD'S BRANDING -->
<footer class="footer">
  <div class="footer-logo">M</div>
  <p>© 2024 McDonald's. All rights reserved.</p>
  <p>I'm Lovin' It™</p>
</footer>

// SHOPPING CART - COMPLETE
let cart = [];
let currentItemId = null;
let currentModifier = null;
let currentQuantity = 1;

// ========== FIX 1: CATEGORY FILTERS NOW WORKING ==========
function initializeMenu() {
  const menuGrid = document.getElementById('menuGrid');
  menuGrid.innerHTML = '';
  
  menuItems.forEach(item => {
    const card = document.createElement('div');
    card.className = 'menu-card';
    card.dataset.category = item.category;
    
    card.innerHTML = `
      ${item.popular ? '<div class="popular-badge">الأكثر طلباً</div>' : ''}
      <img src="${item.image}" alt="${item.name}">
      <div class="card-content">
        <h3 class="item-name">${item.name}</h3>
        <p class="item-desc">${item.description}</p>
        <div class="item-meta">
          <div>
            <div class="item-price">${item.price.toFixed(2)}</div>
            <div class="item-calories">${item.calories}</div>
          </div>
          <button class="add-btn" onclick="openModifierModal(${item.id})">أضف إلى الطلب</button>
        </div>
      </div>
    `;
    
    menuGrid.appendChild(card);
  });
  
  // FIXED: Category filter event listeners
  document.querySelectorAll('.category-btn').forEach(btn => {
    btn.addEventListener('click', function(e) {
      e.preventDefault();
      
      // Remove active class from all buttons
      document.querySelectorAll('.category-btn').forEach(b => {
        b.classList.remove('active');
      });
      
      // Add active class to clicked button
      this.classList.add('active');
      
      // Get category
      const category = this.dataset.category;
      
      // Filter menu cards
      document.querySelectorAll('.menu-card').forEach(card => {
        if (category === 'all' || card.dataset.category === category) {
          card.classList.remove('hidden');
        } else {
          card.classList.add('hidden');
        }
      });
    });
  });
}

// MODIFIER FUNCTIONS - PRESERVED
function openModifierModal(itemId) {
  currentItemId = itemId;
  currentQuantity = 1;
  currentModifier = null;
  
  const item = menuItems.find(i => i.id === itemId);
  
  document.getElementById('modifierTitle').textContent = `تخصيص ${item.name}`;
  document.getElementById('flavorTitle').textContent = item.modifiers.title;
  document.getElementById('flavorSubtitle').textContent = item.modifiers.subtitle;
  
  const flavorOptions = document.getElementById('flavorOptions');
  flavorOptions.innerHTML = '';
  
  item.modifiers.options.forEach(option => {
    const optionDiv = document.createElement('div');
    optionDiv.className = 'modifier-option';
    optionDiv.setAttribute('data-id', option.id);
    optionDiv.onclick = () => selectModifierOption(optionDiv, option);
    
    optionDiv.innerHTML = `
      <div class="radio-custom"></div>
      <div class="option-text">
        <div class="option-name" style="font-weight: 700; color: #0a0f1e; margin-bottom: 4px;">${option.name}</div>
        <div class="option-desc" style="color: rgba(0,0,0,0.5); font-size: 13px;">${option.desc}</div>
      </div>
    `;
    
    flavorOptions.appendChild(optionDiv);
  });
  
  document.getElementById('modifierError').style.display = 'none';
  document.getElementById('addOrderBtn').disabled = true;
  document.getElementById('modifierQty').textContent = '١';
  document.getElementById('modifierTotalPrice').textContent = `${item.price.toFixed(2)} ريال`;
  
  document.getElementById('modifierModal').style.display = 'flex';
}

function selectModifierOption(element, option) {
  document.querySelectorAll('.modifier-option').forEach(opt => {
    opt.classList.remove('selected');
  });
  
  element.classList.add('selected');
  currentModifier = option;
  document.getElementById('addOrderBtn').disabled = false;
  document.getElementById('modifierError').style.display = 'none';
}

function adjustQuantity(change) {
  const newQuantity = currentQuantity + change;
  if (newQuantity >= 1 && newQuantity <= 10) {
    currentQuantity = newQuantity;
    document.getElementById('modifierQty').textContent = currentQuantity;
    updateModifierPrice();
  }
}

function updateModifierPrice() {
  const item = menuItems.find(i => i.id === currentItemId);
  const totalPrice = item.price * currentQuantity;
  document.getElementById('modifierTotalPrice').textContent = `${totalPrice.toFixed(2)} ريال`;
}

function addToCartWithModifier() {
  if (!currentModifier) {
    document.getElementById('modifierError').style.display = 'block';
    return;
  }
  
  const item = menuItems.find(i => i.id === currentItemId);
  
  cart.push({
    id: Date.now(),
    itemId: item.id,
    name: item.name,
    basePrice: item.price,
    modifier: {
      name: currentModifier.name,
      desc: currentModifier.desc
    },
    quantity: currentQuantity
  });
  
  updateCart();
  closeModifierModal();
  
  const addBtn = document.querySelector(`[onclick="openModifierModal(${item.id})"]`);
  if (addBtn) {
    const originalHTML = addBtn.innerHTML;
    addBtn.textContent = '✓ تمت الإضافة';
    addBtn.classList.add('added');
    setTimeout(() => {
      addBtn.innerHTML = originalHTML;
      addBtn.classList.remove('added');
    }, 2000);
  }
}

function closeModifierModal() {
  document.getElementById('modifierModal').style.display = 'none';
  currentModifier = null;
}

// ========== FIX 2: CART TOTAL CALCULATION NOW ACCURATE ==========
function updateCart() {
  const cartItems = document.getElementById('cartItems');
  const cartCount = document.querySelector('.cart-count');
  const cartTotal = document.getElementById('cartTotal');
  
  if (cart.length === 0) {
    cartItems.innerHTML = '<p style="text-align: center; color: rgba(0,0,0,0.4); padding: 20px;">سلة التسوق فارغة</p>';
    cartCount.textContent = '0';
    cartTotal.textContent = '٠.٠٠ ريال';
    return;
  }
  
  let total = 0;
  cartItems.innerHTML = '';
  
  cart.forEach((item, index) => {
    // FIXED: Use basePrice * quantity for accurate calculation
    const itemTotal = Number(item.basePrice) * Number(item.quantity);
    total += itemTotal;
    
    const cartItem = document.createElement('div');
    cartItem.className = 'cart-item';
    cartItem.style.padding = '16px 0';
    cartItem.style.borderBottom = '1px solid rgba(0,0,0,0.05)';
    
    cartItem.innerHTML = `
      <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px;">
        <div>
          <strong style="color: #0a0f1e; font-size: 16px;">${item.name}</strong>
          ${item.modifier ? `<div style="color: #da291c; font-size: 13px; margin-top: 6px;">${item.modifier.name}</div>` : ''}
        </div>
        <div style="color: #0a0f1e; font-weight: 800; font-size: 18px;">${itemTotal.toFixed(2)} ريال</div>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <button class="qty-btn" onclick="updateCartQuantity(${index}, ${item.quantity - 1})">-</button>
          <span style="color: #0a0f1e; font-weight: 700; min-width: 30px; text-align: center;">${item.quantity}</span>
          <button class="qty-btn" onclick="updateCartQuantity(${index}, ${item.quantity + 1})">+</button>
        </div>
        <button class="qty-btn" onclick="removeFromCart(${index})" style="background: rgba(255,59,48,0.1); border-color: #ff3b30; color: #ff3b30;">×</button>
      </div>
    `;
    
    cartItems.appendChild(cartItem);
  });
  
  // FIXED: Use total.toFixed(2) to ensure decimal places
  const cartCountTotal = cart.reduce((sum, item) => sum + Number(item.quantity), 0);
  cartCount.textContent = cartCountTotal;
  cartTotal.textContent = `${total.toFixed(2)} ريال`;
}

function updateCartQuantity(index, newQuantity) {
  if (newQuantity < 1) {
    removeFromCart(index);
    return;
  }
  
  if (newQuantity > 10) {
    alert('الحد الأقصى للكمية هو ١٠');
    return;
  }
  
  cart[index].quantity = newQuantity;
  updateCart();
}

function removeFromCart(index) {
  cart.splice(index, 1);
  updateCart();
}

function clearCart() {
  if (cart.length === 0) return;
  
  if (confirm('هل تريد تفريغ السلة؟')) {
    cart = [];
    updateCart();
    toggleCart();
  }
}

function toggleCart() {
  const cartContainer = document.getElementById('cartContainer');
  cartContainer.style.display = cartContainer.style.display === 'flex' ? 'none' : 'flex';
}

// ========== FIXED: PRICES NOW EXACTLY MATCH IN WHATSAPP REDIRECT ==========
function redirectToWhatsAppOrder() {
  if (cart.length === 0) {
    alert('سلة التسوق فارغة. أضف عناصر إلى السلة أولاً.');
    return;
  }
  
  // FIXED: Calculate total with proper decimal handling
  const total = cart.reduce((sum, item) => {
    return sum + (Number(item.basePrice) * Number(item.quantity));
  }, 0);
  
  const cartData = {
    items: cart.map(item => ({
      itemId: item.itemId,
      name: item.name,
      basePrice: Number(item.basePrice),
      quantity: Number(item.quantity),
      modifier: item.modifier,
      total: Number(item.basePrice) * Number(item.quantity)
    })),
    total: Number(total.toFixed(2)),
    source: 'mcdonaldsmenu'
  };
  
  console.log('Cart Data:', cartData); // Debug: Verify prices match
  console.log('Total:', total.toFixed(2));
  
  const encodedCartData = encodeURIComponent(JSON.stringify(cartData));
  window.location.href = `index.html?cartData=${encodedCartData}`;
}

function openCheckout() {
  redirectToWhatsAppOrder();
}

// INITIALIZE
document.addEventListener('DOMContentLoaded', () => {
  initializeMenu();
  
  // Close modal on outside click
  const modifierModal = document.getElementById('modifierModal');
  if (modifierModal) {
    modifierModal.addEventListener('click', (e) => {
      if (e.target === modifierModal) {
        closeModifierModal();
      }
    });
  }
  
  // Initial cart update
  updateCart();
});
